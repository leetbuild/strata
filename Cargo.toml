[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
# Add a crate here when the first crate uses it (cargo warns about unused entries).
strata-archive = { path = "crates/strata-archive" }
strata-cli = { path = "crates/strata-cli" }
strata-core = { path = "crates/strata-core" }
strata-diag = { path = "crates/strata-diag" }
strata-game = { path = "crates/strata-game" }
strata-ini = { path = "crates/strata-ini" }
strata-install = { path = "crates/strata-install" }
strata-launch = { path = "crates/strata-launch" }
strata-nexus = { path = "crates/strata-nexus" }
strata-loot = { path = "crates/strata-loot" }
strata-ui = { path = "crates/strata-ui" }
strata-vfs = { path = "crates/strata-vfs" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fuser = "0.19"
libc = "0.2"
md5 = { package = "md-5", version = "0.10" }
libloot = "0.29"
lz4_flex = "0.14"
miniz_oxide = "0.9"
rayon = "1"
regex = "1"
roxmltree = "0.21"
cxx = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
texture2ddecoder = "0.1"
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release builds are copied between the two PCs, and the desktop has no AVX-512:
# never set target-cpu=native here.
[profile.release]
debug = "line-tables-only"
